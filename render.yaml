services:
  - type: web
    name: minikandan-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && node dist/main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: minikandan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: minikandan-db
    databaseName: kanban_db
    user: postgres
    plan: free
